name: Dart CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.coderabbit.yaml'
      - 'LICENSE'
      - '.gitignore'
  push:
    branches: [ main, "release/**" ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.coderabbit.yaml'
      - 'LICENSE'
      - '.gitignore'

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter plugin (analyze/test)
        working-directory: packages/dart/barnard
        run: |
          flutter --version
          flutter pub get
          flutter analyze
          flutter test
      - name: Flutter plugin Android unit tests
        working-directory: packages/dart/barnard/android
        run: |
          flutter precache --android
          ./gradlew testDebugUnitTest
      - name: Flutter example (analyze)
        working-directory: examples/flutter/barnard_poc
        run: |
          flutter pub get
          flutter analyze
          flutter test

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [flutter]
    defaults:
      run:
        working-directory: examples/dart/barnard_demo
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run bin/main.dart
